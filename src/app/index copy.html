<style>
:root {
--deep: #1e1e1e;
--back: #232323;
--box: #2a2a2a;
--elm: #343434;
--bright: #3d3d3d;
}
* {
outline: 2px solid reda;
}
html, body {
margin: 0;
padding: 0;
font-family: system-ui;
height: 100%;
width: 100%;
overflow: hiddena;
background: black;
color: white;
user-select: none;
}


*::-webkit-scrollbar {
  width: 15px;
  height: 15px;
}
*::-webkit-scrollbar-track {
  background: var(--back);
}
*::-webkit-scrollbar-thumb {
  background-color: var(--elm);
  border-radius: 10px;
  border: 3px solid var(--back);
}

.deepblock { background: var(--deep); }
.backblock { background: var(--back); }
.boxblock { background: var(--box); }
.elmblock { background: var(--elm); }
.brightblock { background: var(--bright); }

.deephover:hover { background: var(--deep); }
.backhover:hover { background: var(--back); }
.boxhover:hover { background: var(--box); }
.elmhover:hover { background: var(--elm); }
.brighthover:hover { background: var(--bright); }

.topline { box-shadow: 0 -2px 0 var(--elm); }
.leftline { box-shadow: -2px 0 0 var(--elm); }
.rightline { box-shadow: 2px 0 0 var(--elm); }
.bottomline { box-shadow: 0 2px 0 var(--elm); }

.bordercolor { border: 1px solid var(--bright); }
.outlinecolor { outline: 1px solid var(--bright); }


.topbox {
position: absolute;
width: 100%;
top: 0;
z-index: 3;
/*background: rgba(255, 0, 0, 0.635);*/
}
.leftbox {
position: absolute;
height: 100%;
left: 0;
z-index: 2;
/*background: rgba(0, 0, 255, 0.635);*/
}
.rightbox {
position: absolute;
height: 100%;
right: 0;
z-index: 2;
/*background: rgba(255, 251, 0, 0.635);*/
}
.bottombox {
position: absolute;
width: 100%;
bottom: 0;
z-index: 3;
/*background: rgba(0, 255, 21, 0.635);*/
font-size: 0;
}

.menubar {
width: 100%;
height: 20px;
font-size: 0;
}
.toolbar {
width: 100%;
margin-top: 2px;
height: 33px;
font-size: 0;
}

.toolpanel {
position: relative;
width: 100px;
height: calc(100% - 259px);
top: 57px;
font-size: 0;
}

.inspector {
position: relative;
width: 300px;
height: calc(100% - 259px);
top: 57px;
}

.toolsections {
display: inline-block;
vertical-align: bottom;
width: 300px;
height: 200px;
font-size: 16px;
}
.timeline {
display: inline-block;
width: calc(100% - 302px);
height: 200px;
margin-left: 2px;
font-size: 16px;
}

.mainbox {
position: absolute;
width: calc(100% - 404px);
height: calc(100% - 259px);
top: 57px;
left: 102px;
overflow: scroll;
z-index: 5;
}



.menubox {
position: absolute;
z-index: 10;
}
.menubtn {
display: inline-block;
vertical-align: top;
font-size: 15px;
font-weight: 500;
padding: 0px 8px 0px 8px;
cursor: pointer;
position: relative;
}
.menusection {
display: none;
position: absolute;
left: 5px;
top: 27px;
box-shadow: 2px 2px 5px 1px #00000038;
border-radius: 5px;
overflow: hidden;
z-index: 10;
}
.menuitem {
font-size: 14px;
font-weight: 400;
min-width: 150px;
padding: 4px 10px 4px 20px;
}

.toolbarbtn {
display: inline-block;
width: 21px;
height: 21px;
padding: 2px;
text-align: center;
font-size: 15px;
border-radius: 5px;
margin-top: 3px;
margin-left: 4px;
box-shadow: 0 0 2px 1px #00000040;
cursor: pointer;
}
.toolbarline {
display: inline-block;
vertical-align: top;
width: 2px;
height: 20px;
margin-top: 7px;
margin-left: 4px;
}

.toolslabel {
display: block;
text-align: center;
font-weight: 500;
font-size: 15px;
padding: 4px;
}
.toolbox {
padding: 4px;
}
.toolbtn {
display: inline-block;
width: 28px;
height: 28px;
padding: 5px;
text-align: center;
font-size: 19px;
border-radius: 5px;
margin-top: 5px;
margin-left: 5px;
box-shadow: 0 0 2px 1px #00000030;
cursor: pointer;
}

.projectlayers {
overflow-y: scroll;
width: 300px;
height: 172px;
}
.createlayer {
position: absolute;
font-weight: 500;
font-size: 25px;
margin-top: -28px;
margin-left: 272px;
width: 28px;
height: 28px;
text-align: center;
line-height: 22px;
cursor: pointer;
}
.layercreator {
display: none;
position: absolute;
width: 268px;
height: 30px;
padding: 8px;
border-radius: 5px;
margin-bottom: 210px;
margin-left: 10px;
bottom: 0;
z-index: 8;
box-shadow: 0 0 10px 1px #00000040;
}

.lselsection {
font-size: 0;
}
.iselsection {
font-size: 0;
}
.lssitem {
display: inline-block;
font-weight: 500;
font-size: 15px;
padding: 4px 12px 4px 12px;
cursor: pointer;
}
.issitem {
display: inline-block;
font-weight: 500;
font-size: 15px;
padding: 4px 12px 4px 12px;
cursor: pointer;
}

/*
backblock -> button element:
background:         deepX, backX, box, elmX, brightX
border-outline:     deep, backX, boxX, elm, bright
box-shadow:         yes, no, 30-40
*/
</style>

<script>

class loomframe {
    constructor() {
        //main project data
        this.project = {
            width: 1280,
            height: 720,
            fps: 24,
            thislayer: 0,
            thisframe: 0,
            editor: {
                fieldwidth: 3000,
                fieldheight: 3000
            },
            camera: {
                x: 0,
                y: 0,
                /*width,
                height,
                scalex,
                scaley,
                zoom,
                rotate*/
            },
            layers: [
                {
                    name: 'Слой 1',
                    type: 'vector',
                    frames: [
                        {
                            objects: [
                                {type: 'path', points: []}
                            ]
                        }
                    ]
                }
            ]
        };
    }

    //UI (dom)
    lcuitoggle() {
        $('.layercreator').fadeToggle(100);
    }

    ssui(group, item) { //select section function
        $(`.${group}ssitem`).removeClass('boxblock');
        $(`.${group}ss`).hide();

        $(`.${group}ssitem.${item}item`).addClass('boxblock');
        $(`.${group}ss.${item}`).show();
    }

    globalclick() {
        $('.menusection').hide();
    }

    openmenu(menu) {
        if($(`.${menu}menu`).css('display') == 'none') {
            setTimeout(() => {
                $(`.${menu}menu`).show();
            }, 1);
        }
    }

    switchmenu(menu) {
        $('.menusection').each(function() {
            if($(this).css('display') == 'block') {
                $('.menusection').hide();
                $(`.${menu}menu`).show();
            }
        });
    }
}

//setup, start, launch, main

let lf = new loomframe(); //editor, system, project, loomframe, lf, LF

//project, camera, object, scene, layer, frame, editor

</script>
